spring:
  profiles:
    active: dev
  application:
    name: notebook-backend
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:notebook;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.notebook.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: notebook-jwt-secret-key-2026-very-long-and-secure
  expiration: 604800000

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    com.notebook: debug
    org.springframework.security: debug
